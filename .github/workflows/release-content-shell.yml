name: Release content_shell bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. content-shell-v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: chromium-high-mem
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, ARM64, HIGH-MEM]
    timeout-minutes: 60
    steps:
      - name: Verify or package bundle
        run: |
          set -euo pipefail
          T=/tmp/provenance-content-shell-arm64-2ece72f2fa.tar.zst
          EXPECT=4e777d45482d312dabaa1ff7c499d0b5738849101bdd9e4d2b01c5de37fc87d8
          if [ -f "$T" ] && echo "$EXPECT  $T" | sha256sum -c 2>/dev/null; then
            echo "using pre-built verified tarball (digest matches release notes)"
          else
            echo "pre-built tarball missing or digest mismatch — repackaging"
            cd /home/ubuntu/chromium-build/src/out/arm64-qual
            STAGE=/tmp/release-bundle
            rm -rf "$STAGE"; mkdir -p "$STAGE/lib"
            cp content_shell "$STAGE/"
            ldd ./content_shell 2>/dev/null | awk '{print $3}' \
              | grep '^/home/ubuntu/chromium-build' | sort -u > /tmp/needed-libs.txt
            while read -r L; do cp -P "$L" "$STAGE/lib/"; done < /tmp/needed-libs.txt
            for F in icudtl.dat v8_context_snapshot.bin *.pak; do
              [ -e "$F" ] && cp "$F" "$STAGE/" || true
            done
            [ -d locales ] && cp -r locales "$STAGE/locales" || true
            cd /home/ubuntu/chromium-build/src
            {
              echo "artifact: content_shell (provenance-gated Chromium 153.0.8010.36)"
              echo "built-from: yubi-OS/chromium fork commit $(git rev-parse HEAD)"
              echo "built-on: ubuntu HIGH-MEM aarch64, $(date -u +%FT%TZ)"
              echo "overlay: yubi-OS/chromium-provenance patches/0001-0007"
              echo "policy: --provenance-mode=block_on_detect|provenance_required"
            } > "$STAGE/provenance.txt"
            cd "$STAGE"
            find . -type f | sort | while read -r F; do sha256sum "$F"; done > MANIFEST.sha256
            cd /tmp
            tar --zstd -cf bundle.tar.zst -C /tmp release-bundle
            sha256sum bundle.tar.zst
            echo "WARNING: repackaged digest differs from release notes — update notes"
          fi

      - name: Attach bundle to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          T=/tmp/provenance-content-shell-arm64-2ece72f2fa.tar.zst
          if [ ! -f "$T" ]; then T=/tmp/bundle.tar.zst; fi
          gh release upload "${{ inputs.tag }}" "$T" \
            --repo yubi-OS/chromium-provenance --clobber
          gh release view "${{ inputs.tag }}" \
            --repo yubi-OS/chromium-provenance \
            --json assets -q '.assets[] | "\(.name) \(.size) bytes"'
