name: Release content_shell bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. content-shell-v0.1.1 or antimony-v153.0.8010.36)'
        required: true
      target:
        description: 'Release target: content-shell or antimony-deb'
        required: false
        default: 'content-shell'

permissions:
  contents: write

concurrency:
  group: chromium-high-mem
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, ARM64, HIGH-MEM]
    timeout-minutes: 60
    steps:
      - name: Package bundle (reproducible tar)
        if: inputs.target != 'antimony-deb'
        run: |
          set -euo pipefail
          cd /home/ubuntu/chromium-build/src/out/arm64-qual
          STAGE=/tmp/release-bundle
          rm -rf "$STAGE"; mkdir -p "$STAGE/lib"
          cp content_shell "$STAGE/"
          ldd ./content_shell 2>/dev/null | awk '{print $3}' \
            | grep '^/home/ubuntu/chromium-build' | sort -u > /tmp/needed-libs.txt
          echo "bundling $(wc -l < /tmp/needed-libs.txt) chromium libs"
          while read -r L; do cp -P "$L" "$STAGE/lib/"; done < /tmp/needed-libs.txt
          for F in icudtl.dat v8_context_snapshot.bin *.pak; do
            [ -e "$F" ] && cp "$F" "$STAGE/" || true
          done
          [ -d locales ] && cp -r locales "$STAGE/locales" || true
          cd /home/ubuntu/chromium-build/src
          {
            echo "artifact: content_shell (provenance-gated Chromium 153.0.8010.36)"
            echo "built-from: yubi-OS/chromium fork commit $(git rev-parse HEAD)"
            echo "built-on: ubuntu HIGH-MEM aarch64, $(date -u +%FT%TZ)"
            echo "overlay: yubi-OS/chromium-provenance patches/0001-0009"
            echo "policy: --provenance-mode=block_on_detect|provenance_required"
          } > "$STAGE/provenance.txt"
          cd "$STAGE"
          find . -type f | sort | while read -r F; do sha256sum "$F"; done > MANIFEST.sha256
          cd /tmp
          rm -f bundle.tar.zst
          tar --zstd --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf bundle.tar.zst -C /tmp release-bundle
          sha256sum bundle.tar.zst | tee bundle.sha256

      - name: Stage antimony deb + sha256
        if: inputs.target == 'antimony-deb'
        run: |
          set -euo pipefail
          DEB=/home/ubuntu/chromium-build/src/out/arm64-release/antimony-stable_153.0.8010.36-1_arm64.deb
          test -f "$DEB"
          cp "$DEB" /tmp/antimony-stable_153.0.8010.36-1_arm64.deb
          sha256sum /tmp/antimony-stable_153.0.8010.36-1_arm64.deb | tee /tmp/deb.sha256

      - name: Create draft release with asset attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ "${{ inputs.target }}" = "antimony-deb" ]; then
            DIGEST=$(cut -d' ' -f1 /tmp/deb.sha256)
            SIZE=$(stat -c %s /tmp/antimony-stable_153.0.8010.36-1_arm64.deb)
            {
              echo "First Antimony release — the provenance-gated Chromium fork, rebranded end-to-end."
              echo ""
              echo '**package:** antimony-stable (Debian package format 2.0, arm64)'
              echo '**built-from:** yubi-OS/chromium fork, provenance-gate branch e45ecdc355, overlay patches 0001-0019'
              echo '**built-on:** ubuntu HIGH-MEM aarch64 (Snapdragon X1E80100), non-component release build (is_component_build = false)'
              echo ""
              echo "## Package digest (immutable-build discipline: verify before use)"
              echo ""
              echo '```'
              echo "$DIGEST  antimony-stable_153.0.8010.36-1_arm64.deb"
              echo "$SIZE  antimony-stable_153.0.8010.36-1_arm64.deb"
              echo '```'
              echo ""
              echo "## Install"
              echo ""
              echo '```'
              echo "sudo dpkg -i antimony-stable_153.0.8010.36-1_arm64.deb"
              echo '```'
              echo ""
              echo "Installs to /opt/antimony, menu entry \"Antimony Web Browser\"."
              echo "Unsigned for v0.1 — the digest above is the integrity anchor."
            } > /tmp/notes.md
            # 1. draft (invisible, mutable)  2. asset attaches at creation
            # 3. NO publish — left as draft for owner review
            gh release create "$TAG" \
              --repo yubi-OS/chromium-provenance \
              --draft \
              --target main \
              --prerelease \
              --title "Antimony $TAG" \
              --notes-file /tmp/notes.md \
              /tmp/antimony-stable_153.0.8010.36-1_arm64.deb
            gh release view "$TAG" --repo yubi-OS/chromium-provenance \
              --json isDraft,assets -q '"draft: \(.isDraft)", (.assets[] | "asset: \(.name) \(.size) bytes")'
            echo "deb digest: $DIGEST"
            echo "draft left unpublished for owner review"
            exit 0
          fi
          DIGEST=$(cut -d' ' -f1 /tmp/bundle.sha256)
          SIZE=$(stat -c %s /tmp/bundle.tar.zst)
          {
            echo "Provenance-gated content_shell runtime bundle for the yubiOS build."
            echo ""
            echo "Supersedes content-shell-v0.1.0 (published asset-less before the"
            echo "draft-then-attach-then-publish flow was put in place)."
            echo ""
            echo "**artifact:** content_shell (provenance-gated Chromium 153.0.8010.36)"
            echo "**built-from:** yubi-OS/chromium fork, provenance-gate branch, overlay patches 0001-0009"
            echo "**built-on:** ubuntu HIGH-MEM aarch64 (Snapdragon X1E80100)"
            echo "**policy:** --provenance-mode=block_on_detect | provenance_required"
            echo ""
            echo "## Bundle digest (immutable-build discipline: verify before use)"
            echo ""
            echo '```'
            echo "$DIGEST  bundle.tar.zst"
            echo "$SIZE  bundle.tar.zst"
            echo '```'
            echo ""
            echo "The bundle carries its own per-file MANIFEST.sha256 and provenance.txt"
            echo "inside release-bundle/ after extraction."
            echo ""
            echo "## Usage"
            echo ""
            echo '```'
            echo "tar --zstd -xf bundle.tar.zst"
            echo "cd release-bundle && LD_LIBRARY_PATH=\$PWD/lib ./content_shell --ozone-platform=headless --provenance-mode=block_on_detect <url>"
            echo '```'
            echo ""
            echo "System libs (asound, atk, cairo, ...) are not bundled — the distro provides them."
          } > /tmp/notes.md
          # 1. draft (invisible, mutable)  2. asset attaches at creation  3. publish
          gh release create "$TAG" \
            --repo yubi-OS/chromium-provenance \
            --draft \
            --target main \
            --prerelease \
            --title "content_shell (provenance-gated) $TAG" \
            --notes-file /tmp/notes.md \
            /tmp/bundle.tar.zst
          gh release edit "$TAG" --repo yubi-OS/chromium-provenance --draft=false
          gh release view "$TAG" --repo yubi-OS/chromium-provenance \
            --json isDraft,assets -q '"draft: \(.isDraft)", (.assets[] | "asset: \(.name) \(.size) bytes")'
          echo "bundle digest: $DIGEST"
