name: antimony-package-upload
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. antimony-v153.0.8010.36-r2'
        required: true
      title:
        description: 'Release title (defaults to the tag)'
        required: false
jobs:
  upload:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Collect packages + hashes
        run: |
          set -euo pipefail
          rm -rf /tmp/antimony-release && mkdir -p /tmp/antimony-release
          cd /tmp/antimony-release
          cp /home/ubuntu/chromium-build/src/out/arm64-release/antimony-stable_*_arm64.deb .
          cp /home/ubuntu/chromium-build/src/out/arm64-release/antimony-stable_*_aarch64.rpm .
          cp /home/ubuntu/chromium-build/src/out/amd64-release/antimony-stable_*_amd64.deb .
          cp /home/ubuntu/chromium-build/src/out/amd64-release/antimony-stable_*_x86_64.rpm .
          sha256sum * | tee SHA256SUMS
          {
            echo "## SHA256"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Official builds: is_official_build=true, thin LTO + CFI, stripped binaries."
            echo "Built on the yubi-OS HIGH-MEM runner from the chromium-provenance patch series at Chromium 153.0.8010.36."
          } > /tmp/antimony-NOTES.md
      - name: Create draft prerelease with assets
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW }}
        run: |
          set -euo pipefail
          files=()
          for f in /tmp/antimony-release/*.deb /tmp/antimony-release/*.rpm; do
            files+=("$f")
          done
          title="${{ inputs.title }}"
          [ -z "$title" ] && title="${{ inputs.tag }}"
          gh release create "${{ inputs.tag }}" "${files[@]}" \
            --repo yubi-OS/chromium-provenance --draft --prerelease \
            --title "$title" --notes-file /tmp/antimony-NOTES.md
