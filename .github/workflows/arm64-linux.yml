name: Chromium Linux ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-high-mem
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, HIGH-MEM]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Record host and disk capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            date -u +%FT%TZ
            uname -a
            cat /etc/os-release
            nproc
            free -h
            df -h "$GITHUB_WORKSPACE" "$HOME"
            id
            for tool in git python3 gcc g++ clang clang++ rustc cargo cmake ninja node pkg-config; do
              command -v "$tool" || true
            done
            if sudo -n true; then echo SUDO_AVAILABLE; else echo NO_PASSWORDLESS_SUDO; fi
          } | tee evidence/host.txt
          test "$(uname -m)" = aarch64
      - name: Inspect bridge and Funnel transport
        shell: bash
        run: |
          set -euo pipefail
          {
            tailscale funnel status --json || true
            systemctl show shell-bridge.service -p User -p ActiveState -p SubState -p MainPID || true
            curl --max-time 5 -sS -o /dev/null -w 'LOCAL_BRIDGE_HTTP=%{http_code}\n' http://127.0.0.1:8080/run || true
            tailscale debug prefs | python3 -c 'import json,sys; j=json.load(sys.stdin); print("OperatorUser:",j.get("OperatorUser")); print("RunSSH:",j.get("RunSSH"))' || true
          } 2>&1 | tee evidence/bridge-transport.txt
      - name: Inspect filtered Tailscale TLS journal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/tailscale-tls.txt
          import datetime,json,re,subprocess
          print('TLS_DIAGNOSTICS_AT',datetime.datetime.now(datetime.timezone.utc).isoformat())
          r=subprocess.run(['journalctl','-u','tailscaled','--since','2026-09-24 19:45:00 UTC','--until','2026-09-24 20:15:00 UTC','--no-pager','-o','json','-n','1000'],capture_output=True,text=True,timeout=15)
          print('JOURNAL_EXIT',r.returncode)
          print('JOURNAL_ACCESS',r.stderr[:1000])
          rows=[]
          for line in r.stdout.splitlines():
           try: row=json.loads(line)
           except ValueError: continue
           msg=row.get('MESSAGE','')
           if re.search(r'tls|handshake|certificate|cert:|funnel|serve:|ingress',msg,re.I):
            msg=re.sub(r'https?://[^\s]+','[URL redacted]',msg)
            msg=re.sub(r'(?i)(bearer\s+|tskey-[a-z]+-)[A-Za-z0-9_.-]+','[credential redacted]',msg)
            rows.append({'time_us':row.get('__REALTIME_TIMESTAMP'),'message':msg[:1800]})
          print('MATCHED_TLS_ROWS',len(rows))
          for row in rows[-100:]: print(json.dumps(row))
          PY
      - name: Check host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-arm64-host.sh --check 2>&1 | tee evidence/prerequisites.txt
      - name: Compile and run native policy tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -DSTANDALONE_TEST -I. \
            components/provenance_gate/policy.cc components/provenance_gate/policy_unittest.cc \
            -o evidence/policy_test
          evidence/policy_test | tee evidence/policy-test.txt
          file evidence/policy_test | tee evidence/policy-elf.txt
      - name: Run verifier tests on ARM64
        working-directory: verifier
        shell: bash
        run: |
          set -euo pipefail
          node --test 2>&1 | tee ../evidence/verifier-test.txt
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: arm64-qualification-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
