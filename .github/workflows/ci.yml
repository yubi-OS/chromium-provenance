name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  policy-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build + run policy tests (standalone, no Chromium checkout)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -DSTANDALONE_TEST -I. \
            components/provenance_gate/policy.cc components/provenance_gate/policy_unittest.cc -o /tmp/policy_test
          /tmp/policy_test
      - name: Validate policy JSON against schema
        run: |
          python3 -m pip install --quiet jsonschema || python3 -m pip install --quiet --break-system-packages jsonschema
          python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('policy/default.json')), json.load(open('policy/schema.json'))); print('policy/default.json OK')"
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: cd verifier && npm test
